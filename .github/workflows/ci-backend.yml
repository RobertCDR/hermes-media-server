name: CI Backend (.NET 10)

on:
  push:
    branches: [main, 'chore/**', 'feat/**']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore backend/Hermes.slnx --locked-mode || dotnet restore backend/Hermes.slnx

      - name: Build solution
        run: dotnet build backend/Hermes.slnx --configuration Release --no-restore

      - name: Run unit and integration tests
        run: dotnet test backend/Hermes.slnx --configuration Release --no-build --verbosity normal
