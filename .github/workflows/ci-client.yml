name: CI Client (Flutter)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.50.0'
          channel: 'stable'
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Analyze Dart and Flutter code
        run: flutter analyze --fatal-infos

      - name: Run Flutter unit and widget tests with coverage
        run: flutter test --coverage

      - name: Publish Flutter coverage summary
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import os

          lcov_path = "coverage/lcov.info"
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          lines_out = ["### Flutter Client Code Coverage (LCOV)", ""]

          if not os.path.exists(lcov_path):
              lines_out.append("_No coverage/lcov.info file was generated._")
          else:
              covered = 0
              total = 0
              file_count = 0
              with open(lcov_path, "r", encoding="utf-8") as fh:
                  for line in fh:
                      line = line.strip()
                      if line.startswith("SF:"):
                          file_count += 1
                      elif line.startswith("LF:"):
                          total += int(line[3:])
                      elif line.startswith("LH:"):
                          covered += int(line[3:])

              pct = (covered / total * 100.0) if total else 0.0
              lines_out.append("| Scope | Files | Covered Lines | Total Lines | Line Coverage |")
              lines_out.append("| :--- | ---: | ---: | ---: | ---: |")
              lines_out.append(f"| `client/lib` | {file_count} | **{covered}** | **{total}** | **{pct:.2f}%** |")

          text = "\n".join(lines_out) + "\n"
          print(text)
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as fh:
                  fh.write(text)
          PY

      - name: Upload Flutter coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: client-coverage-lcov
          path: client/coverage/lcov.info
          if-no-files-found: warn

  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.50.0'
          channel: 'stable'
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Build Android APK (release)
        run: flutter build apk --release

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.50.0'
          channel: 'stable'
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Build Windows Desktop (release)
        run: flutter build windows --release

  build-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.50.0'
          channel: 'stable'
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Build Web (release)
        run: flutter build web --release
