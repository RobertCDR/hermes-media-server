name: CI Client (Flutter)

on:
  push:
    branches: [main, 'chore/**', 'feat/**']
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: 'stable'
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Analyze Dart and Flutter code
        run: flutter analyze --fatal-infos

      - name: Run Flutter unit and widget tests
        run: flutter test
